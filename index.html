<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watersens - Smart IPAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#0ea5e9', primaryDark: '#0284c7' }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background: radial-gradient(circle at top left, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        .input-field { transition: all 0.3s ease; }
        .input-field:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-96 h-96 bg-white opacity-40 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-primary opacity-20 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl overflow-hidden relative z-10 p-10">
        
        <div class="text-center mb-8">
            <div class="mx-auto bg-gradient-to-tr from-primary to-cyan-300 w-16 h-16 rounded-full flex items-center justify-center shadow-lg mb-4 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16c3.314 0 6-2.686 6-6 0-3.1-2.67-5.903-5.263-8.12a1.12 1.12 0 00-1.474 0C8.67 11.097 6 13.9 6 17c0 3.314 2.686 6 6 6z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Watersens</h1>
            <p class="text-sm font-medium text-primary mt-1">Enterprise Monitoring</p>
        </div>

        <form id="loginForm">
            <div class="mb-5">
                <label class="block text-gray-600 text-xs font-bold mb-2 uppercase tracking-wide" for="idPengguna">ID Pengguna</label>
                <input type="text" id="idPengguna" class="input-field w-full px-4 py-3 rounded-xl bg-white/80 border border-gray-200 focus:border-primary focus:outline-none text-gray-700" placeholder="Contoh: admin123" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-600 text-xs font-bold mb-2 uppercase tracking-wide" for="password">Kata Sandi</label>
                <input type="password" id="password" class="input-field w-full px-4 py-3 rounded-xl bg-white/80 border border-gray-200 focus:border-primary focus:outline-none text-gray-700" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-3.5 px-4 rounded-xl transition duration-300 shadow-[0_8px_20px_rgba(14,165,233,0.3)] hover:shadow-[0_8px_25px_rgba(2,132,199,0.4)] transform hover:-translate-y-1">
                Masuk Sistem
            </button>
        </form>
    </div>

    <div class="fixed bottom-2 right-3 text-[9px] font-mono text-gray-600 opacity-20 pointer-events-none select-none z-0">
        sys.auth.build_cv.alam_raya.2026
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrRBcpC9y1z4uGlWx7cqha463oN4Ufmh4",
            authDomain: "watersens-v1.firebaseapp.com",
            databaseURL: "https://watersens-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "watersens-v1",
            storageBucket: "watersens-v1.firebasestorage.app",
            messagingSenderId: "252858653025",
            appId: "1:252858653025:web:0bc7b113d2c19041a88d20"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app); 

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rawId = document.getElementById('idPengguna').value.trim();
            const emailFormat = rawId + "@sistem.alamraya.com"; 
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "Memeriksa Otoritas...";
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, emailFormat, password);
                
                const userRef = ref(db, 'users/' + rawId);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    const dataPengguna = snapshot.val();
                    
                    sessionStorage.setItem("userRole", dataPengguna.role);
                    sessionStorage.setItem("userId", rawId);
                    window.location.href = "dashboard.html"; 
                } else {
                    alert("Akun valid, tapi jabatan belum terdaftar di sistem Database!");
                    btn.innerText = "Masuk Sistem";
                    btn.disabled = false;
                }

            } catch (error) {
                alert("Akses Ditolak: ID atau Sandi salah!");
                btn.innerText = "Masuk Sistem";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
