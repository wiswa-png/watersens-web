<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Sistem - Watersens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .sidebar-glass { background: rgba(14, 165, 233, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Tambahan Overlay Hitam untuk HP -->
    <div id="overlayMenu" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <!-- Sidebar Responsif -->
    <aside id="sidebar" class="absolute z-50 md:relative w-64 h-full sidebar-glass text-white flex flex-col shadow-2xl transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="p-6 text-center border-b border-white/20">
            <h2 class="text-2xl font-bold tracking-wider">WATERSENS</h2>
            <p class="text-xs font-light mt-1 opacity-80">CV. ALAM RAYA</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">📊 Ringkasan Sistem</a>
            <a href="riwayat.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">💧 Riwayat Data IPAL</a>
            <div id="adminMenu">
                <a href="pabrik.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition mt-2">🏢 Manajemen Pabrik</a>
                <a href="godmode.html" class="block px-4 py-3 bg-white/20 rounded-lg font-medium shadow-sm text-yellow-300">⚙️ Manajemen Sistem</a>
            </div>
        </nav>
        <div class="p-4 border-t border-white/20">
            <button id="btnLogout" class="w-full bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition shadow-md">Keluar Sistem</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto w-full">
        <!-- HEADER DIPERBARUI DENGAN TOMBOL MENU -->
        <header class="bg-white shadow-sm px-6 md:px-8 py-5 flex justify-between items-center z-10 w-full">
            <div class="flex items-center gap-3">
                <button id="btnMenu" class="md:hidden text-gray-700 text-3xl font-bold focus:outline-none">☰</button>
                <h1 class="text-xl font-semibold text-gray-800">Panel Kendali Jaringan</h1>
            </div>
            <div class="text-right hidden sm:block">
                <p id="displayId" class="text-sm font-bold text-gray-800">Memuat...</p>
                <p id="displayRole" class="text-xs text-yellow-500 font-semibold uppercase">ROLE</p>
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-8">
            
            <!-- PANEL REGISTRASI ALAT -->
            <div id="panelAlat" class="hidden bg-gradient-to-r from-sky-50 to-white p-5 md:p-8 rounded-2xl shadow-sm border border-sky-100 max-w-6xl mx-auto">
                <h2 class="text-xl md:text-2xl font-bold text-sky-800 mb-6 border-b border-sky-200 pb-4">Registrasi Unit Alat Baru</h2>
                <form id="formBuatAlat" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="block text-sky-700 text-xs font-bold mb-2 uppercase">ID Alat (Tanpa Spasi)</label>
                        <input type="text" id="idAlat" class="w-full px-4 py-2.5 rounded-xl bg-white border border-sky-200 focus:border-sky-500 outline-none" required placeholder="ipal_01">
                    </div>
                    <div>
                        <label class="block text-sky-700 text-xs font-bold mb-2 uppercase">Nama Lokasi/Pabrik</label>
                        <input type="text" id="namaAlat" class="w-full px-4 py-2.5 rounded-xl bg-white border border-sky-200 focus:border-sky-500 outline-none" required placeholder="Pabrik Mengwi">
                    </div>
                    <div>
                        <label class="block text-sky-700 text-xs font-bold mb-2 uppercase">Admin Pengelola</label>
                        <select id="pemilikAlat" class="w-full px-4 py-2.5 rounded-xl bg-white border border-sky-200 focus:border-sky-500 outline-none" required>
                            <option value="" disabled selected>Memuat Admin...</option>
                        </select>
                    </div>
                    <button type="submit" id="btnBuatAlat" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 px-4 rounded-xl transition shadow-md">
                        + Daftarkan Alat
                    </button>
                </form>

                <div class="mt-6 overflow-x-auto rounded-xl border border-gray-100">
                    <table class="w-full text-left text-sm border-collapse bg-white min-w-[500px]">
                        <thead class="bg-sky-100 text-sky-800">
                            <tr>
                                <th class="p-3 font-semibold">ID Alat</th>
                                <th class="p-3 font-semibold">Nama Lokasi</th>
                                <th class="p-3 font-semibold">Admin</th>
                                <th class="p-3 font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelAlat" class="divide-y divide-gray-100 text-gray-700"></tbody>
                    </table>
                </div>
            </div>

            <!-- PANEL PEMBUATAN AKUN -->
            <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-gray-100 max-w-6xl mx-auto">
                <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Registrasi Akun Bawahan</h2>
                <form id="formBuatAkun" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <div>
                            <label class="block text-gray-600 text-sm font-bold mb-2">ID Pengguna</label>
                            <input type="text" id="newId" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-gray-600 text-sm font-bold mb-2">Kata Sandi</label>
                            <input type="text" id="newPassword" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-gray-600 text-sm font-bold mb-2">Jabatan</label>
                            <select id="newRole" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none" required>
                                <option value="" disabled selected>-- Pilih --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-600 text-sm font-bold mb-2">Lokasi / Keterangan</label>
                            <input type="text" id="newLokasi" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none" placeholder="Contoh: Bali" required>
                        </div>
                        <div id="wadahPilihInduk" class="hidden">
                            <label id="labelInduk" class="block text-gray-600 text-sm font-bold mb-2">Pilih Atasan</label>
                            <select id="indukAdmin" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-sky-400 focus:border-sky-600 outline-none border-2">
                                <option value="" disabled selected>-- Pilih Atasan --</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btnBuat" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
                        Tambahkan Akun
                    </button>
                </form>

                <div class="mt-8 overflow-x-auto rounded-xl border border-gray-200">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-gray-100 text-gray-800 border-b-2 border-gray-200">
                                <th class="p-4 font-semibold">ID Pengguna & Lokasi</th>
                                <th class="p-4 font-semibold">Kata Sandi</th>
                                <th class="p-4 font-semibold">Jabatan</th>
                                <th class="p-4 font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelAkun" class="text-gray-700 bg-white"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- SISTEM MENU RESPONSIF -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const btnMenu = document.getElementById('btnMenu');
        const overlayMenu = document.getElementById('overlayMenu');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlayMenu.classList.toggle('hidden');
        }

        if(btnMenu) btnMenu.addEventListener('click', toggleMenu);
        if(overlayMenu) overlayMenu.addEventListener('click', toggleMenu);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const userRole = sessionStorage.getItem("userRole");
        const userId = sessionStorage.getItem("userId");
        if (!userRole || userRole === "user") { window.location.href = "dashboard.html"; }
        document.getElementById('displayId').innerText = userId;
        document.getElementById('displayRole').innerText = userRole;
        document.getElementById('btnLogout').addEventListener('click', () => {
            if(confirm("Keluar dari sistem?")) { sessionStorage.clear(); window.location.href = "index.html"; }
        });

        const hierarkiAkses = { 'developer': ['superadmin', 'admin', 'user'], 'superadmin': ['admin', 'user'], 'admin': ['user'] };
        const wewenangSaya = hierarkiAkses[userRole]; 
        if (userRole === 'developer' || userRole === 'superadmin') document.getElementById('panelAlat').classList.remove('hidden');

        const dropdownJabatan = document.getElementById('newRole');
        const wadahPilihInduk = document.getElementById('wadahPilihInduk');
        const selectInduk = document.getElementById('indukAdmin');
        const labelInduk = document.getElementById('labelInduk');
        let databaseAkun = {}; 

        if (wewenangSaya.includes('superadmin')) dropdownJabatan.innerHTML += `<option value="superadmin">Super Admin</option>`;
        if (wewenangSaya.includes('admin')) dropdownJabatan.innerHTML += `<option value="admin">Admin (Cabang)</option>`;
        if (wewenangSaya.includes('user')) dropdownJabatan.innerHTML += `<option value="user">User (Pekerja)</option>`;

        dropdownJabatan.addEventListener('change', (e) => {
            const roleDipilih = e.target.value;
            wadahPilihInduk.classList.add('hidden');
            let opsiInduk = `<option value="" disabled selected>-- Pilih Atasan --</option>`;

            if (roleDipilih === 'admin' && userRole === 'developer') {
                for (let id in databaseAkun) {
                    if (databaseAkun[id].role === 'superadmin') opsiInduk += `<option value="${id}">${id} (${databaseAkun[id].lokasi || 'Pusat'})</option>`;
                }
                labelInduk.innerText = "Tugaskan ke Super Admin:";
                selectInduk.innerHTML = opsiInduk;
                wadahPilihInduk.classList.remove('hidden');
            } else if (roleDipilih === 'user' && (userRole === 'developer' || userRole === 'superadmin')) {
                for (let id in databaseAkun) {
                    if (databaseAkun[id].role === 'admin') opsiInduk += `<option value="${id}">${id} (${databaseAkun[id].lokasi || 'Cabang'})</option>`;
                }
                labelInduk.innerText = "Tugaskan ke Tim Admin:";
                selectInduk.innerHTML = opsiInduk;
                wadahPilihInduk.classList.remove('hidden');
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBrRBcpC9y1z4uGlWx7cqha463oN4Ufmh4",
            authDomain: "watersens-v1.firebaseapp.com",
            databaseURL: "https://watersens-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "watersens-v1",
            storageBucket: "watersens-v1.firebasestorage.app",
            messagingSenderId: "252858653025",
            appId: "1:252858653025:web:0bc7b113d2c19041a88d20"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        onValue(ref(db, 'users'), (snapshot) => {
            databaseAkun = snapshot.val() || {};
            let opsiAdminAlat = `<option value="" disabled selected>-- Pilih Admin --</option>`;
            const tabelAkun = document.getElementById('tabelAkun');
            
            let daftarBawahan = {};

            for (let id in databaseAkun) {
                if (id === "godmode") continue;
                const data = databaseAkun[id];
                
                if (data.role === 'admin') {
                    opsiAdminAlat += `<option value="${id}">${id} - ${data.lokasi || 'Tanpa Lokasi'}</option>`;
                }

                if (wewenangSaya.includes(data.role)) {
                    if (userRole === 'admin' && data.induk !== userId) continue;
                    daftarBawahan[id] = { id: id, ...data, children: [] };
                }
            }
            document.getElementById('pemilikAlat').innerHTML = opsiAdminAlat;

            let akarPohon = [];
            for (let id in daftarBawahan) {
                const user = daftarBawahan[id];
                const induk = user.induk;
                if (induk && daftarBawahan[induk]) {
                    daftarBawahan[induk].children.push(user);
                } else {
                    akarPohon.push(user);
                }
            }

            let htmlTabel = "";
            const renderBaris = (node, kedalaman) => {
                let paddingKiri = kedalaman === 0 ? "pl-4 md:pl-6" : (kedalaman === 1 ? "pl-8 md:pl-16" : "pl-12 md:pl-24");
                let ikon = kedalaman === 0 ? "🏢" : "👤";
                let bgColor = kedalaman === 0 ? "bg-sky-50/50" : "bg-white hover:bg-gray-50";
                let garisKiri = kedalaman === 0 ? "border-l-4 border-l-sky-400" : (kedalaman === 1 ? "border-l-4 border-l-gray-300" : "");
                let lokasiTeks = node.lokasi ? `<br><span class="text-xs text-sky-600 font-medium">📍 ${node.lokasi}</span>` : "";

                htmlTabel += `
                    <tr class="${bgColor} border-b border-gray-100 transition">
                        <td class="p-4 ${paddingKiri} ${garisKiri} whitespace-nowrap">
                            <div class="font-bold text-gray-900">${ikon} ${node.id}</div>
                            ${lokasiTeks}
                        </td>
                        <td class="p-4 font-mono text-gray-500">${node.sandi || '***'}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded text-[10px] font-bold uppercase tracking-wider ${node.role === 'admin' ? 'bg-indigo-100 text-indigo-700' : (node.role === 'superadmin' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700')}">${node.role}</span>
                        </td>
                        <td class="p-4 text-center">
                            <button class="btn-hapus-akun bg-red-50 text-red-600 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-red-200 transition" data-id="${node.id}">Hapus</button>
                        </td>
                    </tr>
                `;

                node.children.forEach(anak => renderBaris(anak, kedalaman + 1));
            };

            akarPohon.forEach(akar => renderBaris(akar, 0));
            tabelAkun.innerHTML = htmlTabel || `<tr><td colspan="4" class="p-8 text-center text-gray-400">Belum ada akun terdaftar.</td></tr>`;

            document.querySelectorAll('.btn-hapus-akun').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if(confirm("Hapus akun ini beserta seluruh bawahannya?")) await remove(ref(db, 'users/' + e.target.getAttribute('data-id')));
                });
            });
        });

        if (userRole === 'developer' || userRole === 'superadmin') {
            onValue(ref(db, 'devices'), (snapshot) => {
                const tabelAlat = document.getElementById('tabelAlat');
                tabelAlat.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        tabelAlat.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-bold text-sky-900">${child.key}</td>
                                <td class="p-3 font-medium">${child.val().nama}</td>
                                <td class="p-3"><span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs font-bold">${child.val().pemilik}</span></td>
                                <td class="p-3 text-center"><button class="btn-hapus-alat text-red-500 font-bold text-xs" data-id="${child.key}">Hapus</button></td>
                            </tr>
                        `;
                    });
                    document.querySelectorAll('.btn-hapus-alat').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            if(confirm("Hapus alat?")) await remove(ref(db, 'devices/' + e.target.getAttribute('data-id')));
                        });
                    });
                }
            });
        }

        document.getElementById('formBuatAkun').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newId = document.getElementById('newId').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const newRole = document.getElementById('newRole').value;
            const newLokasi = document.getElementById('newLokasi').value; 
            const btn = document.getElementById('btnBuat');

            let induk = "";
            if (newRole === 'superadmin') induk = userRole === 'developer' ? userId : "";
            else if (newRole === 'admin') induk = (userRole === 'superadmin') ? userId : document.getElementById('indukAdmin').value;
            else if (newRole === 'user') induk = (userRole === 'admin') ? userId : document.getElementById('indukAdmin').value;

            if ((newRole === 'admin' && userRole === 'developer') || (newRole === 'user' && userRole !== 'admin')) {
                if (!induk) return alert("Peringatan: Anda WAJIB memilih Atasan di kotak yang tersedia!");
            }

            btn.innerText = "Memproses..."; btn.disabled = true;
            try {
                await createUserWithEmailAndPassword(secondaryAuth, newId + "@sistem.alamraya.com", newPassword);
                
                await set(ref(db, 'users/' + newId), { 
                    role: newRole, 
                    sandi: newPassword, 
                    induk: induk,
                    lokasi: newLokasi 
                });
                
                await signOut(secondaryAuth);
                alert(`Akun ${newId} berhasil dibuat!`);
                e.target.reset();
                wadahPilihInduk.classList.add('hidden');
            } catch (error) { alert("GAGAL: " + error.message); } 
            finally { btn.innerText = "Tambahkan Akun"; btn.disabled = false; }
        });

        document.getElementById('formBuatAlat').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idAlat = document.getElementById('idAlat').value.trim();
            const pemilikAlat = document.getElementById('pemilikAlat').value;
            if (!pemilikAlat) return alert("Pilih Admin pengelola alat!");
            document.getElementById('btnBuatAlat').innerText = "Menyimpan...";
            try {
                await set(ref(db, 'devices/' + idAlat), { nama: document.getElementById('namaAlat').value, pemilik: pemilikAlat });
                e.target.reset();
            } catch (error) { alert("GAGAL: " + error.message); }
            finally { document.getElementById('btnBuatAlat').innerText = "+ Daftarkan Alat"; }
        });
    </script>
</body>
</html>
