<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat IPAL - Watersens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .sidebar-glass { background: rgba(14, 165, 233, 0.9); backdrop-filter: blur(10px); }
    </style>
    
    <!-- IDENTITAS APLIKASI PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3254/3254068.png">
</head>
<body class="flex h-screen overflow-hidden">

    <div id="overlayMenu" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <aside id="sidebar" class="absolute z-50 md:relative w-64 h-full sidebar-glass text-white flex flex-col shadow-2xl transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="p-6 text-center border-b border-white/20">
            <h2 class="text-2xl font-bold tracking-wider">WATERSENS</h2>
            <p class="text-xs font-light mt-1 opacity-80">CV. ALAM RAYA</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">📊 Ringkasan Sistem</a>
            <a href="riwayat.html" class="block px-4 py-3 bg-white/20 rounded-lg font-medium shadow-sm text-yellow-300">💧 Riwayat Data IPAL</a>
            <div id="adminMenu" class="hidden">
                <a href="pabrik.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition mt-2">🏢 Manajemen Pabrik</a>
                <a href="godmode.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">⚙️ Manajemen Sistem</a>
            </div>
        </nav>
        <div class="p-4 border-t border-white/20">
            <button id="btnLogout" class="w-full bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition shadow-md">Keluar Sistem</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto w-full">
        <header class="bg-white shadow-sm px-6 md:px-8 py-5 flex justify-between items-center z-10 w-full">
            <div class="flex items-center gap-3">
                <button id="btnMenu" class="md:hidden text-gray-700 text-3xl font-bold focus:outline-none">☰</button>
                <h1 class="text-xl font-bold text-gray-800">Laporan & Riwayat Sensor</h1>
            </div>
            <div class="text-right hidden sm:block">
                <p id="displayId" class="text-sm font-bold text-gray-800">Memuat...</p>
                <p id="displayRole" class="text-xs text-sky-600 font-semibold uppercase">ROLE</p>
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-6">
            
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-sky-100 border-l-4 border-l-sky-500 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[100%] md:min-w-[200px]">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Unit Alat</label>
                    <select id="pilihAlat" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none font-bold text-sky-900 cursor-pointer">
                        <option value="" disabled selected>-- Memuat Alat... --</option>
                    </select>
                </div>
                
                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Rentang Waktu</label>
                    <select id="intervalData" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-sky-500 outline-none text-gray-700 cursor-pointer">
                        <option value="0" selected>Semua Data (Default)</option>
                        <option value="600000">10 Menit Terakhir</option>
                        <option value="1800000">30 Menit Terakhir</option>
                        <option value="3600000">1 Jam Terakhir</option>
                        <option value="10800000">3 Jam Terakhir</option>
                        <option value="21600000">6 Jam Terakhir</option>
                        <option value="43200000">12 Jam Terakhir</option>
                        <option value="86400000">24 Jam Terakhir</option>
                    </select>
                </div>

                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Tgl Mulai</label>
                    <input type="date" id="tglMulai" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none text-gray-700">
                </div>
                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Tgl Akhir</label>
                    <input type="date" id="tglAkhir" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none text-gray-700">
                </div>
                
                <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0">
                    <button id="btnCari" class="flex-1 md:flex-none bg-sky-500 hover:bg-sky-600 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md">
                        Cari Data
                    </button>
                    <button id="btnDownload" class="hidden flex-1 md:flex-none bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        📥 Excel
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto h-[60vh]">
                    <table class="w-full text-left border-collapse text-sm relative">
                        <thead class="bg-sky-50 text-sky-800 border-b border-sky-200 sticky top-0 z-10">
                            <tr>
                                <th class="p-4 font-semibold whitespace-nowrap">Waktu / Tanggal</th>
                                <th class="p-4 font-semibold">pH</th>
                                <th class="p-4 font-semibold whitespace-nowrap">DO (mg/L)</th>
                                <th class="p-4 font-semibold whitespace-nowrap">TDS (PPM)</th>
                                <th class="p-4 font-semibold whitespace-nowrap">Suhu (°C)</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelRiwayat" class="divide-y divide-gray-100 text-gray-700">
                            <tr><td colspan="6" class="p-8 text-center text-gray-400 font-medium">Silakan pilih alat dan klik "Cari Data".</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const btnMenu = document.getElementById('btnMenu');
        const overlayMenu = document.getElementById('overlayMenu');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlayMenu.classList.toggle('hidden');
        }
        if(btnMenu) btnMenu.addEventListener('click', toggleMenu);
        if(overlayMenu) overlayMenu.addEventListener('click', toggleMenu);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // LINK GOOGLE SCRIPT TERBARU BOS
        const API_URL = "https://script.google.com/macros/s/AKfycbwwTpboDUZDDuQI3IZMiF1NV_gYR-gQe4U-JZsuttSMvlDMBKGlz0FLmnRvpz3Vy8Xr/exec"; 

        const userRole = sessionStorage.getItem("userRole");
        const userId = sessionStorage.getItem("userId");
        if (!userRole || !userId) window.location.href = "index.html";
        
        document.getElementById('displayId').innerText = userId;
        document.getElementById('displayRole').innerText = userRole;
        if (userRole === "developer" || userRole === "superadmin" || userRole === "admin") {
            document.getElementById('adminMenu').classList.remove('hidden');
        }
        document.getElementById('btnLogout').addEventListener('click', () => {
            if(confirm("Keluar dari sistem?")) { sessionStorage.clear(); window.location.href = "index.html"; }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBrRBcpC9y1z4uGlWx7cqha463oN4Ufmh4",
            authDomain: "watersens-v1.firebaseapp.com",
            databaseURL: "https://watersens-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "watersens-v1",
            storageBucket: "watersens-v1.firebasestorage.app",
            messagingSenderId: "252858653025",
            appId: "1:252858653025:web:0bc7b113d2c19041a88d20"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let dataExport = [];

        const muatDaftarAlat = async () => {
            let myInduk = "";
            if (userRole === "user") {
                const userRef = await get(ref(db, 'users/' + userId));
                if (userRef.exists()) myInduk = userRef.val().induk;
            }
            const pilihAlat = document.getElementById('pilihAlat');
            const devicesRef = await get(ref(db, 'devices'));
            
            let opsiHTML = `<option value="" disabled selected>-- Pilih Unit Alat --</option>`;
            
            if (devicesRef.exists()) {
                devicesRef.forEach((child) => {
                    const idAlat = child.key;
                    const dataAlat = child.val();
                    const pemilik = dataAlat.pemilik;

                    let bolehMelihat = false;
                    if (userRole === 'developer' || userRole === 'superadmin') bolehMelihat = true;
                    else if (userRole === 'admin' && pemilik === userId) bolehMelihat = true;
                    else if (userRole === 'user' && pemilik === myInduk) bolehMelihat = true;

                    if (bolehMelihat) opsiHTML += `<option value="${idAlat}">📍 ${dataAlat.nama || 'Tanpa Nama'} (${idAlat})</option>`;
                });
            }
            pilihAlat.innerHTML = opsiHTML;
        };
        muatDaftarAlat();

        document.getElementById('btnCari').addEventListener('click', async () => {
            const idAlat = document.getElementById('pilihAlat').value;
            const intervalWaktu = parseInt(document.getElementById('intervalData').value);
            
            let tglMulai = document.getElementById('tglMulai').value;
            let tglAkhir = document.getElementById('tglAkhir').value;

            if (!idAlat) return alert("Pilih Unit Alat terlebih dahulu!");

            if (!tglMulai || !tglAkhir) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                const todayStr = `${yyyy}-${mm}-${dd}`; 
                
                tglMulai = todayStr;
                tglAkhir = todayStr;
                
                document.getElementById('tglMulai').value = tglMulai;
                document.getElementById('tglAkhir').value = tglAkhir;
            }

            const tabelRiwayat = document.getElementById('tabelRiwayat');
            const btnDownload = document.getElementById('btnDownload');

            tabelRiwayat.innerHTML = `<tr><td colspan="6" class="p-8 text-center font-bold text-sky-600 animate-pulse">⏳ Sedang Menarik Data dari Google Drive...</td></tr>`;
            btnDownload.classList.add('hidden');
            dataExport = []; 

            try {
                const response = await fetch(`${API_URL}?idAlat=${idAlat}`);
                const dataCSV = await response.text();

                if (dataCSV.includes("KOSONG") || dataCSV.includes("ERROR")) {
                    tabelRiwayat.innerHTML = `<tr><td colspan="6" class="p-8 text-center font-bold text-red-500">⚠️ ${dataCSV}</td></tr>`;
                    return;
                }

                const barisData = dataCSV.trim().split('\n');
                let htmlRows = "";
                let hasData = false;
                
                // 🟢 WAKTU KOMPUTER SAAT INI (Agar filter sangat akurat & tidak muncul dobel)
                const waktuSekarang = new Date().getTime();

                for (let i = barisData.length - 1; i > 0; i--) {
                    const kolom = barisData[i].split(';'); 
                    
                    if (kolom.length >= 6) {
                        const tglStr = kolom[0];   
                        const waktuStr = kolom[1]; 
                        const suhu = parseFloat(kolom[2]);
                        const ph = parseFloat(kolom[3]);
                        const tds = parseFloat(kolom[4]);
                        const doVal = parseFloat(kolom[5]);
                        
                        const dateObj = new Date(`${tglStr}T${waktuStr}`);
                        const timestamp = dateObj.getTime();

                        // Filter Tanggal
                        if (tglMulai && tglStr < tglMulai) continue;
                        if (tglAkhir && tglStr > tglAkhir) continue;

                        // 🟢 FILTER X MENIT TERAKHIR
                        if (intervalWaktu > 0) {
                            if ((waktuSekarang - timestamp) > intervalWaktu) continue;
                        }

                        hasData = true;
                        let status = "AMAN";
                        let warnaStatus = "bg-emerald-100 text-emerald-700";
                        if (ph < 6.5 || ph > 8.5 || doVal < 4.0 || tds > 1000 || suhu > 35) {
                            status = "PERINGATAN";
                            warnaStatus = "bg-red-100 text-red-700";
                        }

                        const displayWaktu = `${tglStr} ${waktuStr}`;
                        dataExport.push([displayWaktu, ph, doVal, tds, suhu, status]);

                        htmlRows += `
                            <tr class="hover:bg-gray-50 transition border-b">
                                <td class="p-4 font-medium text-gray-800 whitespace-nowrap">${tglStr} <span class="text-sky-400 mx-1">|</span> ${waktuStr}</td>
                                <td class="p-4 text-gray-600 font-bold">${ph.toFixed(1)}</td>
                                <td class="p-4 text-gray-600 font-bold">${doVal.toFixed(1)}</td>
                                <td class="p-4 text-gray-600 font-bold">${tds.toFixed(0)}</td>
                                <td class="p-4 text-gray-600 font-bold">${suhu.toFixed(1)}</td>
                                <td class="p-4">
                                    <span class="px-3 py-1 rounded text-[10px] font-bold uppercase tracking-wider ${warnaStatus}">${status}</span>
                                </td>
                            </tr>
                        `;
                    }
                }

                if (hasData) {
                    tabelRiwayat.innerHTML = htmlRows;
                    btnDownload.classList.remove('hidden'); 
                } else {
                    tabelRiwayat.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500 font-medium">Tidak ada data di rentang waktu tersebut.</td></tr>`;
                }

            } catch (error) {
                tabelRiwayat.innerHTML = `<tr><td colspan="6" class="p-8 text-center font-bold text-red-500">🚨 Gagal terhubung ke Server Drive.</td></tr>`;
            }
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
            if (dataExport.length === 0) return;
            const dataToDownload = [...dataExport].reverse();
            let csvContent = "Waktu/Tanggal,pH,DO (mg/L),TDS (PPM),Suhu (C),Status\n";
            dataToDownload.forEach(rowArray => { csvContent += rowArray.join(",") + "\n"; });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Laporan_Drive_${document.getElementById('pilihAlat').value}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

    <!-- SCRIPT SERVICE WORKER UNTUK PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>
</html>
