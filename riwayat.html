<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat IPAL - Watersens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .sidebar-glass { 
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.95) 0%, rgba(16, 185, 129, 0.95) 100%);
            backdrop-filter: blur(10px); 
        }
    </style>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
</head>
<body class="flex h-screen overflow-hidden relative">

    <div id="overlayMenu" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden"></div>

    <aside id="sidebar" class="absolute z-50 md:relative w-64 h-full sidebar-glass text-white shadow-2xl transition-transform duration-300 -translate-x-full md:translate-x-0 overflow-hidden">
        <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: url('WATER SENS No Background.png'); background-size: 140%; background-position: center; background-repeat: no-repeat; transform: rotate(-15deg) scale(1.1); filter: brightness(200%);"></div>
        <div class="relative z-10 flex flex-col h-full w-full">
            <div class="p-6 text-center border-b border-white/20">
                <h2 class="text-2xl font-bold tracking-wider">WATERSENS</h2>
                <p class="text-xs font-light mt-1 opacity-90">SMART WATER MONITORING</p>
            </div>
            <nav class="flex-1 p-4 space-y-2 mt-4">
                <a href="dashboard.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">📊 Ringkasan Sistem</a>
                <a href="riwayat.html" class="block px-4 py-3 bg-white/25 rounded-lg font-bold shadow-sm text-yellow-300">💧 Riwayat Data IPAL</a>
                <div id="adminMenu" class="hidden">
                    <a href="pabrik.html" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition mt-2">🏢 Manajemen Pabrik</a>
                    <a href="godmode.html" id="menuGodmode" class="block px-4 py-3 hover:bg-white/10 rounded-lg transition">⚙️ Manajemen Sistem</a>
                </div>
            </nav>
            <div class="p-4 border-t border-white/20">
                <button id="btnLogout" class="w-full bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition shadow-md">Keluar Sistem</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto w-full relative z-0">
        <header class="bg-white shadow-sm px-6 md:px-8 py-5 flex justify-between items-center z-10 w-full border-b border-gray-100">
            <div class="flex items-center gap-3">
                <button id="btnMenu" class="md:hidden text-cyan-600 text-3xl font-bold focus:outline-none">☰</button>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Laporan & Riwayat Sensor</h1>
            </div>
            <div class="text-right hidden sm:block">
                <p id="displayId" class="text-sm font-bold text-cyan-700">Memuat...</p>
                <p id="displayRole" class="text-xs text-emerald-500 font-bold uppercase tracking-wider">ROLE</p>
            </div>
        </header>

        <div class="p-4 md:p-8 space-y-6">
            
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-cyan-100 border-l-4 border-l-emerald-400 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[100%] md:min-w-[200px]">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Unit Alat</label>
                    <select id="pilihAlat" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-cyan-400 focus:bg-white focus:ring-2 focus:ring-cyan-100 outline-none font-bold text-cyan-900 cursor-pointer transition">
                        <option value="" disabled selected>-- Memuat Alat... --</option>
                    </select>
                </div>
                
                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Rentang Waktu</label>
                    <select id="intervalData" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-cyan-400 focus:bg-white focus:ring-2 focus:ring-cyan-100 outline-none text-gray-700 cursor-pointer transition">
                        <option value="0" selected>Semua Waktu (Default)</option>
                        <option value="600000">10 Menit Terakhir</option>
                        <option value="3600000">1 Jam Terakhir</option>
                        <option value="21600000">6 Jam Terakhir</option>
                        <option value="86400000">24 Jam Terakhir</option>
                    </select>
                </div>

                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Tgl Mulai</label>
                    <input type="date" id="tglMulai" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-cyan-400 focus:bg-white focus:ring-2 focus:ring-cyan-100 outline-none text-gray-700 transition">
                </div>
                <div class="w-full md:w-auto">
                    <label class="block text-gray-500 text-xs font-bold mb-2 uppercase">Tgl Akhir</label>
                    <input type="date" id="tglAkhir" class="w-full px-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-cyan-400 focus:bg-white focus:ring-2 focus:ring-cyan-100 outline-none text-gray-700 transition">
                </div>
                
                <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0">
                    <button id="btnCari" class="flex-1 md:flex-none bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-600 hover:to-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md shadow-emerald-200">
                        Cari Data
                    </button>
                    <button id="btnDownload" class="hidden flex-1 md:flex-none bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 px-6 rounded-xl transition shadow-md shadow-cyan-200 flex items-center justify-center gap-2">
                        📥 Excel
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto h-[60vh]">
                    <table class="w-full text-left border-collapse text-sm relative">
                        <thead class="bg-cyan-50 text-cyan-800 border-b border-cyan-200 sticky top-0 z-10">
                            <tr>
                                <th class="p-4 font-semibold whitespace-nowrap">Tanggal</th>
                                <th class="p-4 font-semibold whitespace-nowrap">Waktu</th>
                                <th class="p-4 font-semibold">pH</th>
                                <th class="p-4 font-semibold whitespace-nowrap">DO (mg/L)</th>
                                <th class="p-4 font-semibold whitespace-nowrap">TDS (PPM)</th>
                                <th class="p-4 font-semibold whitespace-nowrap">Suhu (°C)</th>
                                <th class="p-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelRiwayat" class="divide-y divide-gray-100 text-gray-700">
                            <tr><td colspan="7" class="p-8 text-center text-gray-400 font-medium">Silakan pilih alat dan klik "Cari Data".</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const btnMenu = document.getElementById('btnMenu');
        const overlayMenu = document.getElementById('overlayMenu');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlayMenu.classList.toggle('hidden');
        }
        if(btnMenu) btnMenu.addEventListener('click', toggleMenu);
        if(overlayMenu) overlayMenu.addEventListener('click', toggleMenu);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Pastikan URL API Apps Script Bos masih benar
        const API_URL = "https://script.google.com/macros/s/AKfycbyaOGTdPuV88e-MZfFz8LNXfsoUavRbgFsopxLQckJMuI8vcxCDbAeCQWAkv6zxz3Gx/exec";

        const userRole = sessionStorage.getItem("userRole");
        const userId = sessionStorage.getItem("userId");
        if (!userRole || !userId) window.location.href = "index.html";
        
        document.getElementById('displayId').innerText = userId;
        document.getElementById('displayRole').innerText = userRole;

        const adminMenu = document.getElementById('adminMenu');
        if (adminMenu) adminMenu.classList.remove('hidden');
        if (userRole === "user") {
            const linkGodmode = document.querySelector('a[href="godmode.html"]');
            if (linkGodmode) linkGodmode.style.display = "none";
        }

        document.getElementById('btnLogout').addEventListener('click', () => {
            if(confirm("Keluar dari sistem?")) { sessionStorage.clear(); window.location.href = "index.html"; }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBrRBcpC9y1z4uGlWx7cqha463oN4Ufmh4",
            authDomain: "watersens-v1.firebaseapp.com",
            databaseURL: "https://watersens-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "watersens-v1",
            storageBucket: "watersens-v1.firebasestorage.app",
            messagingSenderId: "252858653025",
            appId: "1:252858653025:web:0bc7b113d2c19041a88d20"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let dataExport = [];

        // 1. FILTER HAK AKSES ALAT
        const muatDaftarAlat = async () => {
            let myInduk = "";
            if (userRole === "user") {
                const userRef = await get(ref(db, 'users/' + userId));
                if (userRef.exists()) myInduk = userRef.val().induk;
            }
            const pilihAlat = document.getElementById('pilihAlat');
            const devicesRef = await get(ref(db, 'devices'));
            let opsiHTML = `<option value="" disabled selected>-- Pilih Unit Alat --</option>`;
            let jumlahAlat = 0;
            
            if (devicesRef.exists()) {
                devicesRef.forEach((child) => {
                    const idAlat = child.key;
                    const dataAlat = child.val();
                    const pemilik = dataAlat.pemilik;

                    let bolehMelihat = false;
                    if (userRole === 'developer' || userRole === 'superadmin') bolehMelihat = true;
                    else if (userRole === 'admin' && pemilik === userId) bolehMelihat = true;
                    else if (userRole === 'user' && pemilik === myInduk) bolehMelihat = true;

                    if (bolehMelihat) {
                        // Menggunakan nama asli untuk tampilan, tapi ID untuk token
                        const namaAlias = dataAlat.nama || idAlat;
                        opsiHTML += `<option value="${idAlat}" data-nama="${namaAlias}">📍 ${namaAlias} (${idAlat})</option>`;
                        jumlahAlat++;
                    }
                });
            }
            if (jumlahAlat > 0) {
                pilihAlat.innerHTML = opsiHTML;
            } else {
                pilihAlat.innerHTML = `<option value="" disabled selected>-- Tidak ada akses alat --</option>`;
            }
        };
        muatDaftarAlat();

        function formatTanggalBaku(tglStr) {
            if(tglStr.includes('/')) {
                let p = tglStr.split('/');
                if(p[0].length === 2) return `${p[2]}-${p[1]}-${p[0]}`; 
            }
            return tglStr;
        }

        // 2. SISTEM PENCARIAN CERDAS (MENENTUKAN MINGGU OTOMATIS)
        document.getElementById('btnCari').addEventListener('click', async () => {
            const dropdownAlat = document.getElementById('pilihAlat');
            const idAlat = dropdownAlat.value; 
            // Ambil nama folder dari atribut data-nama (misal 'pusat')
            const namaFolderDrive = dropdownAlat.options[dropdownAlat.selectedIndex].getAttribute('data-nama') || idAlat;

            const intervalWaktu = parseInt(document.getElementById('intervalData').value);
            let tglMulai = document.getElementById('tglMulai').value;
            let tglAkhir = document.getElementById('tglAkhir').value;

            if (!idAlat) return alert("Pilih Unit Alat terlebih dahulu!");

            if (!tglMulai || !tglAkhir) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                tglMulai = `${yyyy}-${mm}-${dd}`; 
                tglAkhir = `${yyyy}-${mm}-${dd}`; 
                document.getElementById('tglMulai').value = tglMulai;
                document.getElementById('tglAkhir').value = tglAkhir;
            }

            // KECERDASAN BUATAN: Kalkulasi spesifik nama file berdasarkan rentang kalender
            let daftarFileTerkait = new Set();
            let dMulai = new Date(tglMulai);
            let dAkhir = new Date(tglAkhir);

            while(dMulai <= dAkhir) {
                let t = dMulai.getDate();
                let b = dMulai.getMonth() + 1;
                let mg = Math.floor((t - 1) / 7) + 1;
                daftarFileTerkait.add(`log_Mg${mg}_Bl${b}.csv`);
                dMulai.setDate(dMulai.getDate() + 1); 
            }

            const arrFileTerkait = Array.from(daftarFileTerkait);
            const tabelRiwayat = document.getElementById('tabelRiwayat');
            const btnDownload = document.getElementById('btnDownload');

            tabelRiwayat.innerHTML = `<tr><td colspan="7" class="p-8 text-center font-bold text-cyan-600 animate-pulse">⏳ Mencari Tepat Sasaran... Menarik ${arrFileTerkait.length} file arsip dari Drive...</td></tr>`;
            btnDownload.classList.add('hidden');
            dataExport = []; 

            let semuaBarisData = [];

            // Hanya menarik file yang berkaitan dengan kalender yang dipilih
            for(let i=0; i<arrFileTerkait.length; i++) {
                let namaFile = arrFileTerkait[i];
                try {
                    let response = await fetch(`${API_URL}?token=${namaFolderDrive}&filename=${namaFile}`);
                    let text = await response.text();
                    if (!text.includes("KOSONG") && !text.includes("ERROR") && !text.includes("<html")) {
                        let baris = text.trim().split('\n');
                        baris.forEach(b => {
                            if(b.includes(';') && !b.toLowerCase().includes('tanggal')) {
                                semuaBarisData.push(b);
                            }
                        });
                    }
                } catch(e) {
                    console.warn(`Gagal memuat arsip: ${namaFile}`);
                }
            }

            if(semuaBarisData.length === 0) {
                tabelRiwayat.innerHTML = `<tr><td colspan="7" class="p-8 text-center font-bold text-red-500">⚠️ Tidak ada data direkam pada rentang waktu/tanggal ini. Pastikan alat menyala.</td></tr>`;
                return;
            }

            // Urutkan Terbaru di Atas
            semuaBarisData.sort((a, b) => {
                let A = a.split(';'); let B = b.split(';');
                let valA = formatTanggalBaku(A[0]) + A[1];
                let valB = formatTanggalBaku(B[0]) + B[1];
                return valB.localeCompare(valA); 
            });

            let htmlRows = "";
            let hasData = false;
            const waktuSekarang = new Date().getTime();

            // Masukkan ke Tabel HTML
            semuaBarisData.forEach(baris => {
                const kolom = baris.split(';');
                if (kolom.length >= 6) {
                    const tglAsli = kolom[0].trim();
                    const tglBaku = formatTanggalBaku(tglAsli); 
                    const waktuStr = kolom[1].trim(); 
                    const ph = parseFloat(kolom[2]);
                    const doVal = parseFloat(kolom[3]);
                    const tds = parseFloat(kolom[4]);
                    const suhu = parseFloat(kolom[5]);

                    // Double Filter Tanggal
                    if (tglBaku < tglMulai) return;
                    if (tglBaku > tglAkhir) return;

                    // Filter Jam 
                    const dateObj = new Date(`${tglBaku}T${waktuStr}`);
                    const timestamp = dateObj.getTime();
                    if (intervalWaktu > 0) {
                        if ((waktuSekarang - timestamp) > intervalWaktu) return;
                    }

                    hasData = true;
                    let status = "AMAN";
                    let warnaStatus = "bg-emerald-100 text-emerald-700";
                    if (ph < 6.5 || ph > 8.5 || doVal < 4.0 || tds > 1000 || suhu > 35) {
                        status = "PERINGATAN";
                        warnaStatus = "bg-red-100 text-red-700";
                    }

                    dataExport.push([tglAsli, waktuStr, ph, doVal, tds, suhu, status]);

                    htmlRows += `
                        <tr class="hover:bg-cyan-50/50 transition border-b border-gray-50">
                            <td class="p-4 font-medium text-gray-800 whitespace-nowrap">${tglAsli}</td>
                            <td class="p-4 font-bold text-cyan-600 whitespace-nowrap">${waktuStr}</td>
                            <td class="p-4 text-gray-600 font-bold">${ph.toFixed(1)}</td>
                            <td class="p-4 text-gray-600 font-bold">${doVal.toFixed(1)}</td>
                            <td class="p-4 text-gray-600 font-bold">${tds.toFixed(0)}</td>
                            <td class="p-4 text-gray-600 font-bold">${suhu.toFixed(1)}</td>
                            <td class="p-4">
                                <span class="px-3 py-1 rounded text-[10px] font-bold uppercase tracking-wider ${warnaStatus}">${status}</span>
                            </td>
                        </tr>
                    `;
                }
            });

            if (hasData) {
                tabelRiwayat.innerHTML = htmlRows;
                btnDownload.classList.remove('hidden'); 
            } else {
                tabelRiwayat.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500 font-medium">Tidak ada data lolos filter rentang waktu "${document.getElementById('intervalData').options[document.getElementById('intervalData').selectedIndex].text}".</td></tr>`;
            }
        });

        // 3. DOWNLOAD EXCEL
        document.getElementById('btnDownload').addEventListener('click', () => {
            if (dataExport.length === 0) return;
            const dataToDownload = [...dataExport].reverse(); // Kembalikan urutan kronologis
            
            let csvContent = "Tanggal;Waktu;pH;DO (mg/L);TDS (PPM);Suhu (°C);Status\n";
            dataToDownload.forEach(rowArray => { csvContent += rowArray.join(";") + "\n"; });
            
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Laporan_Drive_${document.getElementById('pilihAlat').value}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
